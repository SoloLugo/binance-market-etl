version: '3.8'

services:
  binance-env:
    build: .
    container_name: exp001_binance
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    # Iniciamos Jupyter Lab automáticamente para tener una interfaz de trabajo
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root